# Minimal PatchPilot Cron Digest
# Copy to .github/workflows/patchpilot-cron.yml
#
# Runs weekly triage + digest, creates a GitHub issue with results.
# Commits state back so trends work across runs.

name: PatchPilot Cron Digest

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC — change to your preference
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          pip install patchpilot

      - name: Triage
        run: |
          patchpilot triage \
            --path . \
            --target-name ${{ github.event.repository.name }} \
            --profile quick \
            --top 5

      - name: Digest
        run: |
          patchpilot digest \
            --path . \
            --target-name ${{ github.event.repository.name }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .patchpilot/
          git diff --cached --quiet || git commit -m "chore: update patchpilot state"
          git push

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST=$(ls -t reports/*_digest_*.md 2>/dev/null | head -1)
          [ -z "$DIGEST" ] && exit 0
          TITLE="[PatchPilot] Weekly Digest — $(date -u +%Y-%m-%d)"
          EXISTING=$(gh issue list --search "PatchPilot Weekly Digest" --state open --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$(cat "$DIGEST")"
          else
            gh issue create --title "$TITLE" --body "$(cat "$DIGEST")" --label "security,patchpilot"
          fi
